<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>광주 2030 청년 주거 인프라 대시보드</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 40px; background-color: #f8f9fa; }
        h1 { color: #333; }
        .card-container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 250px; }
        .card h3 { margin-top: 0; color: #007bff; }
        .score { font-size: 24px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <h1>광주 2030 주거 가성비 & 인프라 통합 지수 (HL-Score)</h1>
    <p>실거래가 데이터 기반 자치구별 청년 주거 환경 분석 결과입니다.</p>

    <div class="card-container">
        {% for d in districts %}
        <div class="card">
            <h3>{{ d.지역 }}</h3>
            <p>HL-Score: <span class="score">{{ d.HL_Score }}</span>점</p>
            <p>평균 임대료: {{ "{:,.0f}".format(d.평균임대료) }}원</p>
            <p>인프라 접근성: {{ d.접근성지수 }}점</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
