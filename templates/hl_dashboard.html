<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>광주광역시 청년 주거·인프라 분석 대시보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 상단 타이틀 및 자치구 필터 -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">광주광역시 청년 주거·인프라 분석 대시보드</h1>
                <p class="text-sm text-slate-500 mt-1">25개 행정동 원본 데이터 기반 맞춤형 생활 지표 및 주거비용 분석</p>
            </div>
            
            <div class="flex flex-wrap gap-2" id="district-filters">
                <button onclick="filterDistrict('전체')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white shadow-md shadow-blue-200 transition-all">전체</button>
                <button onclick="filterDistrict('동구')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">동구</button>
                <button onclick="filterDistrict('서구')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">서구</button>
                <button onclick="filterDistrict('남구')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">남구</button>
                <button onclick="filterDistrict('북구')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">북구</button>
                <button onclick="filterDistrict('광산구')" class="filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">광산구</button>
            </div>
        </div>

        <!-- 메인 그리드 레이아웃 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 좌측: 동 리스트 카드 목록 -->
            <div id="dong-list" class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[750px] overflow-y-auto pr-2">
                <!-- 자바스크립트로 동 카드들이 동적 렌더링됩니다 -->
            </div>

            <!-- 우측: 선택된 동 상세 분석 카드 -->
            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between" id="detail-card">
                <!-- 자바스크립트로 상세 내용이 렌더링됩니다 -->
            </div>

        </div>
    </div>

    <!-- 플라스크에서 전달받은 데이터를 자바스크립트 객체로 주입 -->
    <script>
        const dongsData = {{ dongs | tojson | safe }};
        let currentDistrict = '전체';
        let selectedDongId = dongsData[0].id;

        // 점수별 프로그레스 바 색상 로직 적용
        function getBarColor(score) {
            if (score >= 80) return 'bg-blue-600'; // 80점 이상: 진하고 선명한 블루
            if (score >= 60) return 'bg-blue-400'; // 60점 이상 ~ 80점 미만: 기본 블루
            return 'bg-amber-200';                 // 60점 미만: 조금 연한 노란색
        }

        function filterDistrict(district) {
            currentDistrict = district;
            
            // 버튼 활성화 스타일 변경
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.textContent === district) {
                    btn.className = "filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 text-white shadow-md shadow-blue-200 transition-all";
                } else {
                    btn.className = "filter-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
                }
            });

            renderDashboard();
        }

        function selectDong(id) {
            selectedDongId = id;
            renderDashboard();
        }

        function renderDashboard() {
            const listContainer = document.getElementById('dong-list');
            const detailContainer = document.getElementById('detail-card');

            // 필터링된 동 목록
            const filtered = currentDistrict === '전체' 
                ? dongsData 
                : dongsData.filter(d => d.district === currentDistrict);

            // 1. 좌측 카드 리스트 렌더링
            listContainer.innerHTML = filtered.map(dong => `
                <div onclick="selectDong('${dong.id}')" 
                     class="bg-white p-5 rounded-2xl border transition-all cursor-pointer hover:shadow-md ${selectedDongId === dong.id ? 'border-blue-500 ring-2 ring-blue-100 shadow-sm' : 'border-slate-100'}">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">${dong.district}</span>
                            <h3 class="text-lg font-bold text-slate-900 mt-1.5">${dong.name}</h3>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-slate-400 block">HL-Score</span>
                            <span class="text-xl font-black text-blue-600">${dong.hlScore}</span>
                        </div>
                    </div>
                    <div class="space-y-2 mt-4 pt-3 border-t border-slate-100 text-xs text-slate-600">
                        <div class="flex justify-between">
                            <span>대표 시세 (월세 / 보증금)</span>
                            <span class="font-semibold text-slate-900">${dong.monthlyRent} / ${dong.deposit}</span>
                        </div>
                        <div class="flex justify-between">
                            <span>월 주거 총비용</span>
                            <span class="font-semibold text-slate-900">${dong.totalCost}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            // 2. 우측 상세 분석 카드 렌더링
            const selected = dongsData.find(d => d.id === selectedDongId) || filtered[0];
            if(!selected) return;

            detailContainer.innerHTML = `
                <div>
                    <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                        <div>
                            <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">${selected.district}</span>
                            <h2 class="text-2xl font-black text-slate-900 mt-2">${selected.name} 상세 분석</h2>
                        </div>
                        <div class="text-right bg-blue-50 px-4 py-2 rounded-xl">
                            <div class="text-xs text-blue-500 font-medium">종합 HL-Score</div>
                            <div class="text-2xl font-black text-blue-700">${selected.hlScore}</div>
                        </div>
                    </div>

                    <!-- 주거비 환경 섹션 -->
                    <div class="mt-6 space-y-4">
                        <h4 class="text-sm font-bold text-slate-900 flex items-center gap-2">🏠 주거비용 환경</h4>
                        <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-slate-500 font-medium">대표 시세 (월세 / 보증금)</span>
                                <span class="font-bold text-slate-900">${selected.monthlyRent} / ${selected.deposit}</span>
                            </div>
                            <div class="flex justify-between items-center text-sm pt-2 border-t border-slate-200/60">
                                <span class="text-slate-500 font-medium">월 주거 총비용</span>
                                <span class="font-bold text-blue-600 text-base">${selected.totalCost}</span>
                            </div>
                        </div>
                    </div>

                    <!-- 세부 인프라 점수 그래프 (조건부 색상 적용) -->
                    <div class="mt-6 space-y-4">
                        <h4 class="text-sm font-bold text-slate-900">📊 세부 항목별 점수</h4>
                        
                        <div class="space-y-3">
                            <!-- 생활 인프라 -->
                            <div>
                                <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                                    <span>생활 인프라</span>
                                    <span class="font-bold text-slate-900">${selected.infra}점</span>
                                </div>
                                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                    <div class="h-full rounded-full transition-all duration-500 ${getBarColor(selected.infra)}" style="width: ${selected.infra}%"></div>
                                </div>
                            </div>

                            <!-- 2030 선호시설 -->
                            <div>
                                <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                                    <span>2030 선호시설</span>
                                    <span class="font-bold text-slate-900">${selected.preference}점</span>
                                </div>
                                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                    <div class="h-full rounded-full transition-all duration-500 ${getBarColor(selected.preference)}" style="width: ${selected.preference}%"></div>
                                </div>
                            </div>

                            <!-- 교통 접근성 -->
                            <div>
                                <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                                    <span>교통 접근성</span>
                                    <span class="font-bold text-slate-900">${selected.transport}점</span>
                                </div>
                                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                    <div class="h-full rounded-full transition-all duration-500 ${getBarColor(selected.transport)}" style="width: ${selected.transport}%"></div>
                                </div>
                            </div>

                            <!-- 주거 가성비 -->
                            <div>
                                <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                                    <span>주거 가성비</span>
                                    <span class="font-bold text-slate-900">${selected.costEfficiency}점</span>
                                </div>
                                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                    <div class="h-full rounded-full transition-all duration-500 ${getBarColor(selected.costEfficiency)}" style="width: ${selected.costEfficiency}%"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
                    * 각 항목은 원본 25개 동 실데이터를 완벽하게 반영하고 있습니다.
                </div>
            `;
        }

        // 초기 렌더링 실행
        renderDashboard();
    </script>
</body>
</html>
