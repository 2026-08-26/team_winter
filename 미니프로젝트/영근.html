<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보나마나 (BONAMANA) - G-DRAGON</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .music-card {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        /* 상단 브라운 헤더 */
        .header {
            background-color: #63472c;
            color: #ffffff;
            padding: 24px 20px 18px 20px;
            position: relative;
        }

        .more-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #cccccc;
            font-size: 18px;
            cursor: pointer;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .meta-info {
            font-size: 13px;
            color: #d1c4b8;
            margin-bottom: 18px;
        }

        /* 탭 버튼 메뉴 */
        .tab-group {
            display: flex;
            gap: 8px;
        }

        .tab {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            border: none;
        }

        .tab.active {
            background-color: #ffffff;
            color: #333333;
            font-weight: 600;
        }

        .tab.inactive {
            background-color: rgba(255, 255, 255, 0.15);
            color: #e2d8ce;
        }

        /* 하단 본문 */
        .content {
            padding: 28px 20px 20px 20px;
            text-align: center;
        }

        /* 앨범 아바타 영역 */
        .album-art-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
        }

        .album-art {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a2c11, #8c5a2b);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0a85d;
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .play-icon-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 28px;
            height: 28px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            font-size: 11px;
            color: #333;
        }

        /* 가사 영역 */
        .lyrics {
            font-size: 15px;
            line-height: 1.7;
            color: #222222;
            margin-bottom: 24px;
            word-break: keep-all;
        }

        .more-lyrics-arrow {
            display: inline-block;
            font-size: 12px;
            color: #888888;
            margin-left: 4px;
        }

        /* 바로재생 버튼 */
        .play-button {
            width: 100%;
            padding: 12px 0;
            border: 1px solid #e2e2e2;
            border-radius: 10px;
            background-color: #ffffff;
            color: #333333;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .play-button:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="music-card">
        <!-- 상단 곡 정보 및 헤더 -->
        <div class="header">
            <span class="more-btn">⋮</span>
            <div class="title">보나마나 (BONAMANA)</div>
            <div class="meta-info">노래 · G-DRAGON · 2025.02.25.</div>
            
            <div class="tab-group">
                <button class="tab active">전체</button>
                <button class="tab inactive">곡정보</button>
                <button class="tab inactive">수록앨범</button>
                <button class="tab inactive">비슷한 아티스트</button>
            </div>
        </div>

        <!-- 하단 메인 본문 -->
        <div class="content">
            <!-- 앨범 이미지 영역 -->
            <div class="album-art-wrapper">
                <div class="album-art">
                    Übermensch
                </div>
                <div class="play-icon-badge">▶</div>
            </div>

            <!-- 가사 3줄 -->
            <div class="lyrics">
                몇 신데 눈을 뜨자 하루가 지네<br>
                며칠째 죽을 쑤다 가루 떡이 돼<br>
                멍하니 널 기다리다 이 개 같은 신세... <span class="more-lyrics-arrow">∨</span>
            </div>

            <!-- 바로재생 버튼 -->
            <button class="play-button">
                <span>▶</span> 바로재생
            </button>
        </div>
    </div>

</body>
</html>
